# TealKitCoder CLI Configuration
prompt:
  multiline: false
  error_color: "bright_yellow"
  submit_key: "enter"
  auto_paste_images: true

agent:
  planning: true
  compression_threshold: 4000
  max_tool_iterations: 100
  progressive_tools: "auto"

compact_tools: true

permissions:
  auto_approve_read: true
  auto_approve_write: false
  auto_approve_execute: false
  auto_approve_network: false

session:
  max_size_mb: 10
  max_turns: 500
  auto_save: true
  file_pattern: "tealkitcoder_session_{timestamp}.json"

rag:
  enabled: true
  database_path: "rag_index.db"
  sources:
    folders: []
    web: []
    max_pages: 50
  file_extensions:
    - ".txt"
    - ".md"
    - ".pdf"
    - ".docx"
    - ".csv"
    - ".json"
  chunking:
    chunk_size: 1000
    chunk_overlap: 150
  embedding:
    provider: "openai_compatible"
    model: "qwen3-embedding-0.6b"
    gpu_layers: 0
    base_url: "http://localhost:64000"
    api_key: ""
  search:
    mode: "hybrid"
    max_chunks: 5
    min_score: 0.15
