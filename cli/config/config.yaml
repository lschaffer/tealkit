# TealKitCoder CLI Configuration
prompt:
  multiline: false
  error_color: "bright_yellow"
  submit_key: "enter"
  auto_paste_images: true

agent:
  planning: true
  compression_threshold: 4000

compact_tools: true

session:
  max_size_mb: 10
  max_turns: 500
  auto_save: true
  file_pattern: "tealkitcoder_session_{timestamp}.json"

rag:
  enabled: true
  database_path: "c:/Users/Public/TealKitCoder/rag_index.db"
  sources:
    folders:
      - "c:/Users/Public/ThiesClimaDocRoot"
    web:
      - "https://www.thiesclima.com"
    max_pages: 100
  file_extensions:
    - ".txt"
    - ".md"
    - ".pdf"
    - ".docx"
    - ".csv"
    - ".json"
  chunking:
    chunk_size: 1000
    chunk_overlap: 150
  embedding:
    provider: "openai_compatible"
    model: "qwen3-embedding-0.6b"
    gpu_layers: 0
    base_url: "http://localhost:64000"
    api_key: ""
  search:
    mode: "hybrid"
    max_chunks: 5
    min_score: 0.15
