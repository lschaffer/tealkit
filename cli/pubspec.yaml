name: tealkit_cli
description: "TealKit native CLI — server management, configuration auto-discovery, task runner, and direct skill prompt execution."
version: 1.4.9
publish_to: 'none'

environment:
  sdk: ^3.8.0

dependencies:
  args: ^2.6.0
  yaml: ^3.1.4
  http: ^1.2.2
  path: ^1.9.0
  ffi: ^2.1.3
  tealkit_api:
    path: ../api
  dart_mcp_core: ^1.5.14
  dartssh2: ^4.1.0
  # Embedded GGUF inference is not bundled in CLI (use external llama.cpp/Ollama/vLLM)
  llamadart:
    path: ../third_party/llamadart_stub
  image: ^4.12.0
  sqlite3: ^3.9.1
  archive: ^4.0.0
  pdfium_dart: ^0.3.0
  crypto: ^3.0.3

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
