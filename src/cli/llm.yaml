# TealKit LLM Configuration Sample
# Global parameters applied across all models:
temperature: 0.2
max_tokens: 8192
max_tool_iterations: 100

# Supported providers: openai, claude, gemini, ollama, mistral, openai_compatible, embedded
default: "deepinfra_qwen3-coder"

llms:
  - name: "deepinfra_qwen3-coder"
    provider: "openai_compatible"
    model: "Qwen/Qwen3-Coder-480B-A35B-Instruct-Turbo"
    api_key: "${DEEPINFRA_API_KEY}"
    base_url: "https://api.deepinfra.com/v1/openai"

  - name: "deepseek"
    provider: "openai_compatible"
    model: "deepseek-ai/DeepSeek-V3"
    api_key: "${DEEPSEEK_API_KEY}"
    base_url: "https://api.deepinfra.com/v1/openai"

  - name: "ollama"
    provider: "ollama"
    model: "qwen2.5-coder:14b"
    base_url: "http://localhost:11434"

  - name: "mistral"
    provider: "mistral"
    model: "mistral-medium-latest"
    api_key: "${MISTRAL_API_KEY}"

  - name: "gemini"
    provider: "gemini"
    model: "gemini-2.5-flash"
    api_key: "${GEMINI_API_KEY}"

  - name: "claude"
    provider: "claude"
    model: "claude-3-7-sonnet-20250219"
    api_key: "${ANTHROPIC_API_KEY}"

  - name: "qwen-coder-embedded"
    provider: "embedded"
    repo: "Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF"
    model: "qwen2.5-coder-1.5b-instruct-q4_k_m.gguf"
    context_size: 4096
    gpu_layers: 0
