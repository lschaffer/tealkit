name: tealkit
description: "TealKit - AI Agent with MCP tools"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.5.4+122

environment:
  sdk: ^3.10.7

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  path_provider: ^2.1.1
  path: ^1.9.0
  yaml: ^3.1.2
  provider: ^6.1.1 
  tealkit_api:
    path: ./api

  # HTTP client
  http: ^1.2.1

  # Logging
  talker_flutter: ^4.7.0

  # Utilities
  uuid: ^4.5.3
  dart_duckdb: 1.4.4
  archive: ^4.0.0
  pointycastle: ^4.0.0

  # PDF text extraction (MIT, free, uses PDFium — all platforms)
  pdfrx: ^2.2.24
  pdf: ^3.11.1
  fl_chart: ^0.69.2

  # State management
  flutter_riverpod: ^3.2.1

  # Local storage for LLM settings
  shared_preferences: ^2.3.5

  # LLM Providers
  googleai_dart: ^8.0.0
  openai_dart: ^7.0.0
  anthropic_sdk_dart: ^5.0.0
  ollama_dart: ^2.3.0

  # MCP Communication
  web_socket_channel: ^3.0.2
 
  flutter_markdown_plus: ^1.0.7
  flutter_widget_from_html: ^0.16.0

  # File Handling
  file_picker: ^11.0.2
  image_picker: ^1.1.2
  mime: ^2.0.0
  open_file: ^3.5.10
  share_plus: ^11.1.0

  # Code editor with syntax highlighting
  flutter_code_editor: ^0.3.5
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0

  # Utilities
  url_launcher: ^6.3.1
  flutter_js: ^0.8.7
  flutter_secure_storage: ^10.0.0
  flutter_web_auth_2: ^5.0.2
  crypto: ^3.0.6
  google_sign_in: ^7.2.0
  mailer: ^7.1.0
  enough_mail: ^2.1.7
  geolocator: ^14.0.2
  permission_handler: ^11.4.0
  device_info_plus: ^11.3.3
  package_info_plus: ^8.3.0

  # SSH / SFTP
  dartssh2: ^2.18.0
    #path: ./third_party/dartssh2

  # Embedded (on-device) LLM via llama.cpp
  llamadart: ^0.8.11

  # Background scheduling
  workmanager: ^0.9.0
  android_alarm_manager_plus: 4.0.8
  flutter_local_notifications: ^21.0.0

  # Windows: system tray + startup
  tray_manager: ^0.5.2
  window_manager: ^0.5.1
  launch_at_startup: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  msix: ^3.16.7

dependency_overrides:
  dart_duckdb:
    path: third_party/dart_duckdb
  android_alarm_manager_plus:
    path: third_party/android_alarm_manager_plus

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/github_mcp_registry.json
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

flutter_launcher_icons:
  android: true
  ios: true
  windows:
    generate: true
    image_path: assets/icons/app_icon.png
    icon_size: 48
  image_path: assets/icons/app_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icons/app_icon_foreground.png
  remove_alpha_ios: true
  web:
    generate: false

# ─── MSIX / Windows Store packaging ─────────────────────────────────────────
# Requirements before first build:
#   1. Register the app in Microsoft Partner Center (https://partner.microsoft.com)
#      and note the exact values for identity_name and publisher (CN=…).
#   2. For Store upload: use store: true — no certificate needed (Microsoft signs
#      the package during ingestion).
#   3. For sideloading / local testing: create a self-signed cert (see
#      scripts/create-dev-cert.ps1) and override via the build script params.
# ─────────────────────────────────────────────────────────────────────────────
msix_config:
  display_name: TealKit
  publisher_display_name: Laszlo Schäffer
  identity_name: 5082LaszloSchffer.TealKit
  publisher: CN=2719E44F-8DB6-48A9-9FBF-523EE6A7A7AB
  msix_version: 1.0.0.0                     # ← keep in sync with pubspec version (4-part: major.minor.patch.build)
  logo_path: assets\icons\app_icon.png
  start_menu_icon_path: assets\icons\app_icon.png
  tile_icon_path: assets\icons\app_icon.png
  vs_generated_images_folder_path: windows\runner\resources
  languages: en-us, de-de
  install_certificate: false                # never auto-install in CI; handle manually or via Store
  store: true                               # produces Store-ready unsigned MSIX; set false for sideload
  # certificate_path and certificate_password are intentionally omitted here.
  # Pass them via --certificate-path / --certificate-password on the CLI for
  # sideload / Enterprise builds (see scripts/launch-build-windows-msix.ps1).
  capabilities: internetClient, privateNetworkClientServer, documentsLibrary, picturesLibrary
  restricted_capabilities: runFullTrust
